[workspace]
resolver = "3"
members = [
    "crates/tatsu-core",
    "crates/tatsu-core-testserver",
    "crates/tatsu-js",
    "crates/tatsu-state",
    "crates/tatsu-state-harness",
    "crates/tatsu-ws",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
tatsu-js = { path = "crates/tatsu-js" }
tatsu-state = { path = "crates/tatsu-state" }
tatsu-core = { path = "crates/tatsu-core" }
tatsu-ws = { path = "crates/tatsu-ws" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
specta = { version = "=2.0.0-rc.27", features = ["derive", "indexmap", "serde_json"] }
specta-serde = "=0.0.14"
specta-typescript = "=0.0.14"
proptest = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tempfile = "3"
parking_lot = "0.12"
tokio = "1"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false }
tokio-tungstenite = "0.29"
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
security-framework = "3"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
