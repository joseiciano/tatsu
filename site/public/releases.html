  <style>
    html, body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; }
    code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .gradient-text { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .grid-bg {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.08), transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(168, 85, 247, 0.06), transparent 50%);
    }
    .release-section { border-bottom: 1px solid #1a1a1a; scroll-margin-top: 2rem; }
    .release-section:last-child { border-bottom: none; }
    .release-anchor { color: inherit; text-decoration: none; }
    .release-anchor:hover { color: #f59e0b; }
    .release-anchor .anchor-icon { opacity: 0; margin-left: 0.4rem; font-size: 0.55em; vertical-align: middle; transition: opacity 0.15s; }
    .release-anchor:hover .anchor-icon, .release-anchor:focus .anchor-icon { opacity: 0.7; }
    .note-body ul { list-style: disc; padding-left: 1.25rem; }
    .note-body li { color: #a3a3a3; line-height: 1.7; margin-bottom: 0.375rem; font-size: 0.9375rem; }
    .note-body li strong { color: #f5f5f5; font-weight: 600; }
    .note-body li code { background: #1f1f1f; color: #f5f5f5; padding: 0.0625rem 0.3125rem; border-radius: 0.25rem; font-size: 0.8125em; }
    .note-body h4 { color: #d4d4d4; font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; margin-top: 1.25rem; }
    .note-body h4:first-child { margin-top: 0; }
  </style>
</head>
<body class="min-h-screen grid-bg">

  <!-- Nav -->
  <nav class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between relative z-30">
    <a href="/" class="flex items-center gap-3">
      <img src="icon.png" alt="Tatsu icon" class="w-9 h-9 rounded-lg" />
      <span class="text-xl font-bold">Tatsu</span>
    </a>
    <div class="hidden sm:flex items-center gap-4 sm:gap-6 text-sm text-neutral-400">
      <a href="/#features" class="hover:text-neutral-100 transition-colors">Features</a>
      <a href="guide.html" class="hover:text-neutral-100 transition-colors">Guide</a>
      <a href="/#install" class="hover:text-neutral-100 transition-colors">Install</a>
      <a href="https://github.com/frenchie4111/harness" class="hover:text-neutral-100 transition-colors">GitHub</a>
    </div>
    <button
      id="mobile-menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      class="sm:hidden p-2 -mr-2 text-neutral-400 hover:text-neutral-100 transition-colors"
    ></button>
    <div
      id="mobile-menu"
      class="hidden sm:hidden absolute top-full left-0 right-0 mx-4 mt-1 bg-[#0a0a0a]/95 backdrop-blur border border-neutral-800 rounded-lg shadow-xl overflow-hidden"
    >
      <nav class="flex flex-col py-2 text-sm text-neutral-400">
        <a href="/#features" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Features</a>
        <a href="guide.html" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Guide</a>
        <a href="/#install" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Install</a>
        <a href="https://github.com/frenchie4111/harness" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">GitHub</a>
      </nav>
    </div>
  </nav>

  <!-- Header -->
  <section class="max-w-3xl mx-auto px-6 pt-12 pb-12">
    <div class="text-xs uppercase tracking-widest text-neutral-500 mb-4">Changelog</div>
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
      Release <span class="gradient-text">notes.</span>
    </h1>
    <p class="text-lg text-neutral-400 leading-relaxed">
      Every version of Tatsu, from v1.0 to now.
    </p>
  </section>

  <!-- Releases -->
  <div class="max-w-3xl mx-auto px-6 pb-24">
    <p class="text-neutral-500 text-center py-24">No releases yet. Check back soon.</p>
  </div>

  <!-- Footer -->
  <footer class="border-t border-neutral-900 mt-20">
    <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-neutral-600">
      <div class="flex items-center gap-2">
        <img src="icon.png" alt="" class="w-5 h-5 rounded" />
        <span>Tatsu · Open source · MIT</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="/guide.html" class="hover:text-neutral-300 transition-colors">Guide</a>
        <a href="https://github.com/frenchie4111/harness" class="hover:text-neutral-300 transition-colors">GitHub</a>
        <a href="/releases.html" class="text-neutral-300 transition-colors">Release notes</a>
        <a href="https://github.com/frenchie4111/harness/releases" class="hover:text-neutral-300 transition-colors">Downloads</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('mobile-menu-toggle');
      var menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;
      var iconMenu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
      var iconX = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"/></svg>';
      btn.innerHTML = iconMenu;
      var open = false;
      function setOpen(next) {
        open = next;
        menu.classList.toggle('hidden', !open);
        btn.innerHTML = open ? iconX : iconMenu;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        document.body.classList.toggle('overflow-hidden', open);
      }
      btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!open); });
      document.addEventListener('mousedown', function (e) {
        if (!open) return;
        if (!menu.contains(e.target) && !btn.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (open && e.key === 'Escape') setOpen(false);
      });
      menu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
    })();
  </script>
</body>
</html>
