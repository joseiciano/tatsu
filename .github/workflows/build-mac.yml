name: Build macOS

# Dispatch-only smoke test for the macOS build. The canonical
# tag-driven release runs the same mac build inside
# .github/workflows/release.yml — this file lets us validate the
# full sign + notarize chain on a branch (via the Actions UI's
# "Run workflow" button) without cutting a tag or creating a release.
#
# The output dmg / zip / blockmap / latest-mac.yml are uploaded as a
# workflow artifact (downloadable from the run page for ~90 days) so
# you can install + Gatekeeper-check the dmg before doing a real
# release.
#
# Requires the same secrets as release.yml — see that file's header.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --config.supportedArchitectures='{"os":["darwin"],"cpu":["x64","arm64"]}'

      - name: Build renderer + main
        run: pnpm run build

      - name: Package, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --publish=never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatsu-mac
          path: |
            release/Tatsu-*.dmg
            release/Tatsu-*-mac.zip
            release/Tatsu-*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
