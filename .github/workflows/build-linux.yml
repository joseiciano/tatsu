name: Build Linux

# Dispatch-only smoke test for the Linux build. The canonical
# tag-driven release runs the Linux build inside
# .github/workflows/release.yml — this file lets us validate a Linux
# build on a branch (or via the Actions UI) without cutting a tag.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libgbm1 \
            libasound2t64 \
            fakeroot \
            rpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux packages
        run: pnpm run dist:linux

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-linux
          path: |
            release/Harness-*.AppImage
            release/Harness-*.deb
            release/latest-linux.yml
          if-no-files-found: error
